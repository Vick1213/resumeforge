<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ResumeForge Autofill</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #17181c;
        background: #ffffff;
      }
      header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid #e4e5e9;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }
      main {
        padding: 12px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .status-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .status-ok { color: #0a7a3c; font-weight: 600; }
      .status-bad { color: #b91c1c; font-weight: 600; }
      #adapter-info { color: #55585f; }
      button#scan-button {
        font: inherit;
        font-weight: 700;
        padding: 9px 12px;
        border-radius: 6px;
        border: none;
        background: #17181c;
        color: #fff;
        cursor: pointer;
      }
      button#scan-button:hover { background: #34363d; }
      button#scan-button:disabled { background: #9ca0a8; cursor: default; }
      #scan-result { color: #55585f; min-height: 16px; }
      .tier-block {
        border: 1px solid #e4e5e9;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .tier-block h2 {
        margin: 0 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #55585f;
      }
      .tier-row {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      footer {
        padding: 10px 16px 14px;
        border-top: 1px solid #e4e5e9;
      }
      footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <h1>ResumeForge Autofill</h1>
    </header>
    <main>
      <div class="status-line">
        <span>Backend</span>
        <span id="connection-status">Checking…</span>
      </div>
      <div id="adapter-info">Checking this page…</div>
      <button type="button" id="scan-button">Scan and fill</button>
      <div id="scan-result"></div>
      <div class="tier-block">
        <h2>Last run — fields per tier</h2>
        <div id="tier-counts">No scan run yet.</div>
      </div>
    </main>
    <footer>
      <a href="#" id="options-link">Options</a>
    </footer>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
