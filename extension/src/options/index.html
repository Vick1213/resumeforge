<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ResumeForge Autofill — Options</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #17181c;
        background: #f7f8fa;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      p.subtitle {
        color: #55585f;
        margin-top: 0;
      }
      section {
        background: #fff;
        border: 1px solid #e4e5e9;
        border-radius: 10px;
        padding: 20px 22px;
        margin-bottom: 20px;
      }
      section h2 {
        font-size: 14px;
        margin: 0 0 14px;
      }
      label.field {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #55585f;
        margin-bottom: 6px;
      }
      input[type="url"], input[type="text"], select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d7d9dd;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 16px;
        font-family: inherit;
        background: #fff;
      }
      .effort-row {
        margin-bottom: 16px;
      }
      .effort-row select {
        margin-bottom: 6px;
      }
      .effort-description {
        color: #55585f;
        font-size: 12px;
        margin: 0;
      }
      .toggle-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 16px;
      }
      .toggle-row input { margin-top: 3px; }
      .toggle-row .toggle-copy strong { display: block; }
      .toggle-row .toggle-copy span {
        color: #55585f;
        font-size: 12px;
      }
      .token-badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: 999px;
        background: #ffedd5;
        color: #c2410c;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      button[type="submit"] {
        font: inherit;
        font-weight: 700;
        padding: 9px 16px;
        border: none;
        border-radius: 6px;
        background: #17181c;
        color: #fff;
        cursor: pointer;
      }
      button[type="submit"]:hover { background: #34363d; }
      #save-status {
        margin-left: 10px;
        font-size: 12px;
        color: #0a7a3c;
      }
      #field-map-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 14px;
      }
      .field-map-card {
        border: 1px solid #e4e5e9;
        border-radius: 8px;
        padding: 10px 12px;
      }
      .field-map-host {
        font-weight: 700;
        font-size: 13px;
      }
      .field-map-meta {
        color: #55585f;
        font-size: 12px;
        margin-top: 2px;
      }
      .empty {
        color: #55585f;
        font-size: 13px;
      }
      button#clear-cache-button {
        font: inherit;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #d7d9dd;
        background: #fff;
        color: #b91c1c;
        cursor: pointer;
      }
      button#clear-cache-button:hover { background: #fef2f2; }
    </style>
  </head>
  <body>
    <main>
      <h1>ResumeForge Autofill</h1>
      <p class="subtitle">Options</p>

      <section>
        <h2>Backend</h2>
        <form id="settings-form">
          <label class="field" for="backend-url">Backend base URL</label>
          <input type="url" id="backend-url" name="backend-url" placeholder="http://localhost:5217" />

          <div class="toggle-row">
            <input type="checkbox" id="allow-model-fallback" name="allow-model-fallback" />
            <label class="toggle-copy" for="allow-model-fallback">
              <strong>Allow model fallback <span class="token-badge">spends tokens</span></strong>
              <span
                >When a field can't be resolved by the board adapter or the heuristic matcher,
                send just that field to the backend's model fallback. This is the only tier of the
                cascade that costs anything — the result is remembered per form afterward, so the
                same form costs zero tokens on your next visit.</span
              >
            </label>
          </div>

          <div class="effort-row">
            <label class="field" for="effort-select">Model effort <span class="token-badge">spends tokens</span></label>
            <select id="effort-select" name="effort">
              <option value="minimal">Minimal — cheapest, least of the form goes to the model</option>
              <option value="standard">Standard — default</option>
              <option value="thorough">Thorough — model also drafts free-text answers</option>
              <option value="maximum">Maximum — most tokens, longest free-text answers</option>
            </select>
            <p id="effort-description" class="effort-description"></p>
          </div>

          <button type="submit">Save</button>
          <span id="save-status"></span>
        </form>
      </section>

      <section>
        <h2>Learned field maps</h2>
        <div id="field-map-list"></div>
        <button type="button" id="clear-cache-button">Clear cached field maps</button>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
